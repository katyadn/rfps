<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зворотній зв’язок</title>
</head>
<body>

    <header>
        <img src="images/breaking-news.png" alt="Логотип новинного порталу" width="100" height="80">
        <h1>Новинний портал «ВАЖЛИВІ НОВИНИ»</h1>
        <p>Сторінка «Зворотній зв’язок»</p>
    </header>

    <nav>
        <ul>
            <li><a href="hot-news">Гарячі новини</a></li>
            <li><a href="culture.html">Новини культури</a></li>
            <li><a href="economy.html">Новини економіки</a></li>
            <li><a href="feedback.html">Зворотній зв’язок</a></li>
        </ul>
    </nav>

    <hr>

    <main>

        <h2>Форма зворотного зв’язку</h2>

        <form action="#" method="post">
            
            <fieldset>
                <legend>Персональна інформація</legend>

                <p>
                    <label for="fullName">1. Прізвище та ім’я:</label><br>
                    <input type="text" id="fullName" name="fullName" required placeholder="Введіть Прізвище та Ім'я">
                </p>

                <p>
                    <label for="userEmail">2. E-mail:</label><br>
                    <input type="email" id="userEmail" name="userEmail" required placeholder="name@example.com">
                </p>

                <p>
                    <label for="userAge">3. Вік:</label><br>
                    <input type="number" id="userAge" name="userAge" min="1" max="100" required placeholder="Введіть вік">
                </p>

                <p>
                    <label for="education">4. Освіта:</label><br>
                    <select id="education" name="education" required>
                        <option value="" disabled selected>-- Оберіть рівень освіти --</option>
                        <option value="повна">Повна</option>
                        <option value="неповна">Неповна</option>
                        <option value="вища">Вища</option>
                        <option value="професійна">Професійна</option>
                    </select>
                </p>
            </fieldset>

            <br>

            <p>
                <label for="feedbackGoal">5. Мета зворотного зв’язку:</label><br>
                <select id="feedbackGoal" name="feedbackGoal" required>
                    <option value="" disabled selected>-- Оберіть мету --</option>
                    <option value="співпраця">Співпраця</option>
                    <option value="скарга">Скарга на порушення права власності</option>
                    <option value="пропозиція">Пропозиція</option>
                    <option value="помилка">Наявність помилки</option>
                </select>
            </p>

            <p>
                <label for="detailText">6. Детально:</label><br>
                <textarea id="detailText" name="detailText" rows="6" cols="50" maxlength="1500" style="width: 400px; height: 120px;" placeholder="Введіть детальний опис мети(максимальна довжина 1500 символів)..." required></textarea>
            </p>

            <p>
                <input type="checkbox" id="consent" name="consent" required>
                <label for="consent">Я надаю згоду на обробку моєї персональної інформації</label>
            </p>

            <p>
                <button type="submit">Надіслати</button>
                <button type="reset">Очистити форму</button>
            </p>

        </form>

        <nav>
         <form action="index.html">
             <button type="submit">На головну</button>
         </form>
        </nav>

    </main>

    <hr>

    <footer>
        <p>© 2026 Форма зворотного зв’язку | Новинний портал «Важливі Новини»</p>
    </footer>

</body>
</html>
